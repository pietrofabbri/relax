<p class="occhiello">Il livello 1. Capitolo</p><h2>L'errore e l'aiuto</h2><div class="corpo"><div class="testo"><p class="punto">Una risposta errata <b>non blocca</b> il gioco.</p><p class="punto">Compare un <b>indizio</b>, non la soluzione.</p><p class="punto">La risposta corretta al <b>primo tentativo</b> vale più punti.</p><div class="parole"><p class="tit-parole">Glossario</p><p><b>Indizio</b>. Informazione che orienta verso la risposta.</p></div></div><div class="visivo"><figure class="fig"><img src="/_blob/7f0938eff59ac37668b805558310805c" alt="Indizio dopo una risposta errata" style="width:820px;height:384px;object-fit:contain;flex:none;"><p class="didascalia">Indizio dopo una risposta errata</p></figure></div></div>
