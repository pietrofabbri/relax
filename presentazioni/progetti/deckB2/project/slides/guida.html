<p class="occhiello">A casa</p><h2>La guida per la striscia</h2><div class="corpo"><div class="testo"><p class="punto">Una guida stampabile indica le <b>misure</b> della striscia.</p><p class="punto">La <b>fascia grigia</b> in basso è coperta dal terreno.</p><p class="punto">Il disegno si fotografa e si carica nel gioco.</p><div class="parole"><p class="tit-parole">Glossario</p><p><b>Proporzione</b>. Rapporto tra larghezza e altezza.</p></div></div><div class="visivo"><figure class="fig"><img src="/_blob/d0d97981cf45785ca23fe86ba5665fcb" alt="Particolare della guida" style="width:622px;height:440px;object-fit:contain;flex:none;"><p class="didascalia">Particolare della guida</p></figure></div></div>
