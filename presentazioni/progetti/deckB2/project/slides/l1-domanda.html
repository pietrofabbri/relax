<p class="occhiello">Il livello 1. Domanda</p><h2>La previsione</h2><div class="corpo"><div class="testo"><p class="punto">Prima di alcune esperienze si chiede<br>di <b>prevedere</b> il risultato.</p><p class="punto">Il gioco mostra poi che cosa accade.</p><p class="punto">Il procedimento riprende il metodo scientifico:<br><b>ipotesi, prova, verifica</b>.</p><div class="parole"><p class="tit-parole">Glossario</p><p><b>Ipotesi</b>. Previsione da mettere alla prova.</p></div></div><div class="visivo"><figure class="fig"><img src="/_blob/5604c43ca88a25f6f78746fd75dcfe87" alt="Scelta prima dell'esperienza" style="width:820px;height:384px;object-fit:contain;flex:none;"><p class="didascalia">Scelta prima dell'esperienza</p></figure></div></div>
