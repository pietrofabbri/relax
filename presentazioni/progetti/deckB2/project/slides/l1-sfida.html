<p class="occhiello">Il livello 1. Prova</p><h2>La prova</h2><div class="corpo"><div class="testo"><p class="punto">Tre prove di <b>tipo platform</b>: corsa, salti,<br>nemici, piattaforme mobili.</p><p class="punto">Comandi a schermo. Tre o più <b>cuori</b>:<br>si può perdere e ripetere la prova.</p><div class="parole"><p class="tit-parole">Glossario</p><p><b>Platform</b>. Genere di gioco in cui il personaggio corre e salta tra piattaforme.</p></div></div><div class="visivo"><figure class="fig"><img src="/_blob/d0a2824353d65b8752b86e1885a49485" alt="" style="width:820px;height:379px;object-fit:contain;flex:none;"></figure></div></div>
