<p class="occhiello">Il livello 1. Capitolo</p><h2>Il capitolo</h2><div class="corpo"><div class="testo"><p class="punto">Una <b>breve parte</b> della storia,<br>in due righe.</p><p class="punto">Segue una <b>domanda di ragionamento</b>:<br>la risposta non si trova nel testo, va dedotta.</p><p class="punto">Si prosegue solo dopo aver risposto correttamente.</p><div class="parole"><p class="tit-parole">Glossario</p><p><b>Dedurre</b>. Ricavare una conclusione da ciò che si sa.</p></div></div><div class="visivo"><figure class="fig"><img src="/_blob/98d53413d22391fb8d4a0d7ec0e726b7" alt="" style="width:820px;height:384px;object-fit:contain;flex:none;"></figure></div></div>
</section>
