<p class="occhiello">Parte II. L'opera. Temi</p><h2>Secondo tema: ragione e religione</h2><div class="corpo"><div class="testo"><p class="punto">Absal conosce la verità attraverso la <b>religione</b>,<br>Ḥayy attraverso la <b>ragione</b>.</p><p class="punto">L'autore sostiene che le due strade<br><b>arrivano allo stesso punto</b>.</p><div class="parole"><p class="tit-parole">Glossario</p><p><b>Ragione</b>. La capacità di pensare, collegare, dedurre.</p></div></div><div class="visivo"><figure class="fig emblema"><div class="cornice"><svg class="ico" viewBox="0 0 64 64" width="220" height="220" aria-hidden="true"><path d="M32 8v46M18 56h28M10 18h44" stroke="#5a4632" stroke-width="4" stroke-linecap="round"/><path d="M4 36l6-18 6 18a6 6 0 0 1-12 0zM48 36l6-18 6 18a6 6 0 0 1-12 0z" fill="#f2b84b" stroke="#5a4632" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="8" r="4" fill="#5a4632"/></svg></div></figure></div></div>
